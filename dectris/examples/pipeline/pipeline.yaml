%YAML 1.2
---

connection:
  remote_address: "10.42.41.10:31003"  # DCU RDMA handshake address
  local_address: "10.42.41.11"         # address of the local RoCE interface
  ring_gpu: 0                          # GPU holding the RDMA ring
  ring_mib: 64                         # RDMA ring size in MiB
  timeout: 10                          # timeout seconds

execute:
  seconds: 0                           # run time; 0 = until Ctrl+C
  threads: 3                           # concurrent source, worker and aggregator

receiver:
  receive_only: false                  # true: return the credit at once, no GPU work
  keep_images: false                   # true: copy the images to GPU memory; false: work straight from the ring
  max_batch: 512                       # completions (frames) taken from the receive queue per poll

aggregate:
  series_width: 0                      # images per series row; 0 = a single row
