[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.10,<3"]
build-backend = "scikit_build_core.build"

[project]
name = "imx-receiver"
version = "0.1.0"
description = "Imagemux RDMA transport and registered-ring helpers on libibverbs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy", "cbor2"]

[project.optional-dependencies]
# Optional dependencies for the reusable GPU ring and dispatch helpers.
cuda12 = ["cupy-cuda12x", "PyYAML"]
cuda13 = ["cupy-cuda13x", "PyYAML"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "native"
cmake.define.IMXRX_BUILD_TESTS = "OFF"
wheel.packages = ["src/dectris"]
build-dir = "build/{wheel_tag}"
# The wheel needs the system's libibverbs and its providers (rdma-core) at run time; it does
# not bundle them.
