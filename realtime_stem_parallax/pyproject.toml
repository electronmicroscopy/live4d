[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-stem"
version = "2.1.0"
description = "Real-time STEM processing: a modular ingest → processing → stream-out pipeline (parallax/tcBF)."
requires-python = ">=3.10"
# Core, always needed: numpy (arrays) and pyzmq (the stream-out transport).
# PyTorch is required by the processing engine but is supplied by the runtime environment — the
# Holoscan container ships a CUDA build; installing a pip torch over it would be wrong — so it is
# intentionally not a core dependency. Outside the container, the `local` extra installs it.
dependencies = ["numpy", "pyzmq"]

[project.optional-dependencies]
viz = ["matplotlib"]               # examples/viewer.py, examples/plot_result.py
notebook = ["matplotlib", "ipympl", "ipywidgets"]   # streaming.notebook.LiveView, examples/live_view.ipynb
replay = ["cbor2"]                 # tools/replay_to_zmq.py default mode peeks each record's envelope
                                   # (--fast needs nothing extra); tools/dstream.py info
decode = ["cbor2", "bitshuffle", "dectris-compression"]   # tools/make_dstream.py (synthesize a
                                   # .dstream: real bslz4 + a round-trip self-check; host-side, not in the image)
# Run locally without Holoscan / an NVIDIA GPU: the pure-Python ingest (cbor2 + lz4, with the DECTRIS
# C decoder for speed), the reconstruction on cpu / Apple mps, and tools/simulate_4dstem.py. Never
# install this into the Holoscan container (it would replace the image's CUDA build of torch).
local = ["torch", "cbor2", "lz4", "dectris-compression"]
oracles = ["bitshuffle", "h5py", "hdf5plugin"]   # independent bslz4 implementations the tests check against
dev = ["pytest"]

[project.scripts]
realtime-stem = "realtime_stem.apps.run:main"

[tool.setuptools.packages.find]
include = ["realtime_stem*"]
