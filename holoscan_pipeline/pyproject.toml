[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "live4d"
version = "3.1.0"
description = "Shared HSDK5 4D-STEM pipeline with optional parallax reconstruction"
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml", "cbor2"]

[project.optional-dependencies]
parallax = ["torch", "pyzmq", "lz4", "dectris-compression"]
viz = ["matplotlib"]
notebook = ["matplotlib", "ipympl", "ipywidgets"]
dev = ["pytest", "bitshuffle", "h5py", "hdf5plugin"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"live4d.parallax.streaming.web" = ["static/*"]
"live4d.parallax.examples" = ["data/*", "*.ipynb"]
# Native operators and schemas for the live graph are generated by CMake.
